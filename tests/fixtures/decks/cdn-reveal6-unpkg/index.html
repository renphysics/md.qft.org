  <div class="reveal">

      <section>
        <h1>Entropy in one picture</h1>
        <aside class="notes">Start with the image of a melting ice cube.</aside>
      </section>
      <section>
        <h2>Boltzmann</h2>
        <p>$$S = k_B \ln \Omega$$</p>
      </section>
      <section>
        <h2>Counting states</h2>
        <p class="fragment">Two coins: four arrangements.</p>
        <p class="fragment">One hundred coins: about $10^{30}$.</p>
      </section>
      <section>
        <h2>Summary</h2>
        <pre><code class="language-python" data-trim>
from math import comb, log
print(log(comb(100, 50)))
        </code></pre>
