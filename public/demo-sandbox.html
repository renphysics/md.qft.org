<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; script-src-attr 'none'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive demo frame</title>
  <style>body{margin:0;padding:24px;background:#faf8f4;color:#66616a;font:14px/1.6 system-ui,sans-serif}</style>
</head>
<body>
  <p>Open an interactive demo from the Markdown workspace.</p>
  <script>
    (() => {
      // This runner must never execute supplied content with the site's origin.
      // Only sandbox="allow-scripts" (without allow-same-origin) may use it.
      if (window.parent === window || window.origin !== 'null') return;
      let used = false;
      window.addEventListener('message', (event) => {
        const message = event.data;
        if (used || event.source !== window.parent || !message || typeof message !== 'object'
          || message.type !== 'qft-demo-load' || typeof message.token !== 'string'
          || !/^[a-f0-9]{36}$/.test(message.token)
          || typeof message.html !== 'string' || message.html.length > 160000) return;
        used = true;
        document.open();
        document.write(message.html);
        document.close();
      });
    })();
  </script>
</body>
</html>
